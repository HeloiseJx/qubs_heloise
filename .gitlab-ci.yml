image: rocker/verse:latest

stages:
    - render
    - deploy

variables:
    DB_USER: $DB_USER
    DB_PASSWORD: $DB_PASSWORD
    DB_HOST: $DB_HOST
    DB_PORT: $DB_PORT

before_script:
    - apt-get update && apt-get install -y libssl-dev libcurl4-gnutls-dev libxml2-dev pandoc

render:
    stage: render
    script:
        - echo "Attention"
        - R -e "quarto::quarto_render('R/bilan_qubs.Rmd', output_format = 'html_document', output_dir = '$OUTPUT_DIR')"
        - echo "C'est parti"


deploy:
  stage: deploy
  script:
    - apt-get update && apt-get install -y rsync
    - rsync -av --delete -e "ssh -o StrictHostKeyChecking=no" $OUTPUT_DIR/ $SSH_USER@$SSH_HOST:/path/to/deploy/
  only:
    - main